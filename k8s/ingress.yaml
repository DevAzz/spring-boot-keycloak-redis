apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
#    Явное отключение sticky session
#    nginx.ingress.kubernetes.io/affinity: "cookie"
#    nginx.ingress.kubernetes.io/session-cookie-max-age: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: java-app.local
      http:
        paths:
          - path: /app1
            pathType: Prefix
            backend:
              service:
                name: java-app-1
                port:
                  number: 8081
          - path: /app2
            pathType: Prefix
            backend:
              service:
                name: java-app-2
                port:
                  number: 8081
    - host: keycloak.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080